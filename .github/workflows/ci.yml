name: MASTER X CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: "123456:TEST_TOKEN_NOT_REAL"
      DATABASE_URL: "sqlite+aiosqlite:///./ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate database migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q
